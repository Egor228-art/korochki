<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Корочки.есть</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="register-12-header">
        <div class="register-13-header-container">
            <div class="register-14-logo"><a href="index.html">Корочки.есть</a></div>
            <div class="register-15-burger"><span></span><span></span><span></span></div>
            <nav class="register-16-nav-menu"></nav>
        </div>
    </header>
    
    <div class="register-20-container">
        <div class="register-21-card" style="max-width: 600px; margin: 30px auto;">
            <h2>Регистрация</h2>
            <form id="register-23-registerForm">
                <div class="register-24-form-group"><label>Email</label><input type="email" id="register-24-email" required></div>
                <div class="register-25-form-group"><label>Пароль</label><input type="password" id="register-25-password" required><div class="register-25-error" id="register-25-passwordError"></div></div>
                <div class="register-26-form-group"><label>ФИО</label><input type="text" id="register-26-full_name" required><div class="register-26-error" id="register-26-nameError"></div></div>
                <div class="register-27-form-group"><label>Телефон</label><input type="text" id="register-27-phone" placeholder="8(999)123-45-67" required><div class="register-27-error" id="register-27-phoneError"></div></div>
                <button type="submit" class="register-28-btn">Зарегистрироваться</button>
            </form>
            <p class="register-30-mt-20">Уже есть аккаунт? <a href="login.html">Войти</a></p>
        </div>
    </div>
    
    <footer class="register-34-footer">
        <div class="register-35-footer-container">
            <div class="register-36-footer-col"><h4>Корочки.есть</h4><p>Дополнительное профессиональное образование</p></div>
            <div class="register-37-footer-col"><h4>Контакты</h4><p>8(800)123-45-67</p><p>info@korochki.est</p></div>
            <div class="register-38-footer-col"><h4>Юридическая информация</h4><p>Лицензия №1234</p><p>ОГРН 1234567890123</p></div>
        </div>
        <div class="register-40-footer-bottom"><p>© 2026 Корочки.есть. Все права защищены.</p></div>
    </footer>
    
    <script src="js/common.js"></script>
    <script>
        document.getElementById('register-27-phone')?.addEventListener('input', (e) => phoneMask(e.target));
        
        document.getElementById('register-23-registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('register-24-email').value.trim();
            const password = document.getElementById('register-25-password').value;
            const full_name = document.getElementById('register-26-full_name').value.trim();
            const phone = document.getElementById('register-27-phone').value.trim();
            
            document.querySelectorAll('.register-56-error').forEach(el => el.textContent = '');
            
            if (password.length < 8) {
                document.getElementById('register-25-passwordError').textContent = 'Пароль не менее 8 символов';
                return;
            }
            if (!/^[а-яА-ЯёЁ\s\-]+$/.test(full_name)) {
                document.getElementById('register-26-nameError').textContent = 'ФИО: только кириллица';
                return;
            }
            if (!/^8\(\d{3}\)\d{3}-\d{2}-\d{2}$/.test(phone)) {
                document.getElementById('register-27-phoneError').textContent = 'Формат: 8(XXX)XXX-XX-XX';
                return;
            }
            
            try {
                await pbRegister({ email, password, passwordConfirm: password, full_name, phone, is_admin: false });
                await pbLogin(email, password);
                window.location.href = 'dashboard.html';
            } catch(err) {
                alert('Ошибка: ' + err.message);
            }
        });
    </script>
</body>
</html>
