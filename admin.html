<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель - Корочки.Есть</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50">
    <custom-navbar></custom-navbar>
    
    <main class="container mx-auto px-4 py-8">
        <!-- Сообщения -->
        <div id="messageBox" class="hidden fixed top-4 right-4 p-4 rounded-lg shadow-lg z-50"></div>

        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold">Админ-панель</h1>
            <div class="space-x-2">
                <button onclick="openUserModal()" class="bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-4 rounded">
                    + Добавить пользователя
                </button>
                <button onclick="openCourseModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded">
                    + Добавить курс
                </button>
            </div>
        </div>

        <!-- Табы -->
        <div class="mb-6 border-b border-gray-200">
            <nav class="-mb-px flex space-x-8">
                <button onclick="switchTab('users')" id="usersTab" class="tab-button border-b-2 border-blue-500 text-blue-600 font-medium py-4 px-1">
                    Пользователи (<span id="usersCount">0</span>)
                </button>
                <button onclick="switchTab('courses')" id="coursesTab" class="tab-button border-b-2 border-transparent text-gray-500 font-medium py-4 px-1">
                    Курсы (<span id="coursesCount">0</span>)
                </button>
                <button onclick="switchTab('applications')" id="applicationsTab" class="tab-button border-b-2 border-transparent text-gray-500 font-medium py-4 px-1">
                    Заявки (<span id="applicationsCount">0</span>)
                </button>
                <button onclick="switchTab('feedbacks')" id="feedbacksTab" class="tab-button border-b-2 border-transparent text-gray-500 font-medium py-4 px-1">
                    Отзывы (<span id="feedbacksCount">0</span>)
                </button>
            </nav>
        </div>

        <!-- Контент табов -->
        <div id="usersContent" class="tab-content">
            <div class="bg-white rounded-xl shadow-md overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">ID</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">ФИО</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Email</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Роль</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Телефон</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Дата регистрации</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Действия</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody" class="bg-white divide-y divide-gray-200">
                    </tbody>
                </table>
            </div>
        </div>

        <div id="coursesContent" class="tab-content hidden">
            <div class="bg-white rounded-xl shadow-md overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">ID</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Название</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Категория</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Цена</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Длительность</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Действия</th>
                        </tr>
                    </thead>
                    <tbody id="coursesTableBody" class="bg-white divide-y divide-gray-200">
                    </tbody>
                </table>
            </div>
        </div>

        <div id="applicationsContent" class="tab-content hidden">
            <div class="bg-white rounded-xl shadow-md overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Пользователь</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Курс</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Дата начала</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Оплата</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Статус</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Действия</th>
                        </tr>
                    </thead>
                    <tbody id="applicationsTableBody" class="bg-white divide-y divide-gray-200">
                    </tbody>
                </table>
            </div>
        </div>

        <div id="feedbacksContent" class="tab-content hidden">
            <div class="bg-white rounded-xl shadow-md overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Пользователь</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Курс</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Отзыв</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Дата</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Статус</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Действия</th>
                        </tr>
                    </thead>
                    <tbody id="feedbacksTableBody" class="bg-white divide-y divide-gray-200">
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Модальное окно пользователя -->
    <div id="userModal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
        <div class="relative top-20 mx-auto p-5 border w-full max-w-md shadow-lg rounded-md bg-white">
            <h3 id="userModalTitle" class="text-lg font-medium mb-4">Добавить пользователя</h3>
            <form id="userForm" class="space-y-4">
                <input type="hidden" id="userId">
                <div>
                    <label class="block text-sm font-medium text-gray-700">ФИО *</label>
                    <input type="text" id="userFIO" required class="mt-1 block w-full rounded-md border border-gray-300 p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Имя пользователя *</label>
                    <input type="text" id="userName" required class="mt-1 block w-full rounded-md border border-gray-300 p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email *</label>
                    <input type="email" id="userEmail" required class="mt-1 block w-full rounded-md border border-gray-300 p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Телефон *</label>
                    <input type="tel" id="userPhone" required class="mt-1 block w-full rounded-md border border-gray-300 p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Пароль</label>
                    <input type="password" id="userPassword" class="mt-1 block w-full rounded-md border border-gray-300 p-2">
                    <p class="text-xs text-gray-500 mt-1">Оставьте пустым, если не хотите менять</p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Роль *</label>
                    <select id="userRole" required class="mt-1 block w-full rounded-md border border-gray-300 p-2">
                        <option value="user">Пользователь</option>
                        <option value="admin">Администратор</option>
                    </select>
                </div>
                <div class="flex justify-end space-x-3 pt-4">
                    <button type="button" onclick="closeUserModal()" class="px-4 py-2 bg-gray-300 text-gray-700 rounded-md">Отмена</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Модальное окно курса -->
    <div id="courseModal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
        <div class="relative top-20 mx-auto p-5 border w-full max-w-md shadow-lg rounded-md bg-white">
            <h3 id="courseModalTitle" class="text-lg font-medium mb-4">Добавить курс</h3>
            <form id="courseForm" class="space-y-4">
                <input type="hidden" id="courseId">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Название *</label>
                    <input type="text" id="courseName" required class="mt-1 block w-full rounded-md border border-gray-300 p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Описание *</label>
                    <textarea id="courseDescription" required class="mt-1 block w-full rounded-md border border-gray-300 p-2"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Категория *</label>
                    <input type="text" id="courseCategory" required class="mt-1 block w-full rounded-md border border-gray-300 p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Цена (₽) *</label>
                    <input type="number" id="coursePrice" required class="mt-1 block w-full rounded-md border border-gray-300 p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Длительность *</label>
                    <input type="text" id="courseDuration" required class="mt-1 block w-full rounded-md border border-gray-300 p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Эмодзи</label>
                    <input type="text" id="courseImage" class="mt-1 block w-full rounded-md border border-gray-300 p-2" placeholder="💻">
                </div>
                <div class="flex justify-end space-x-3 pt-4">
                    <button type="button" onclick="closeCourseModal()" class="px-4 py-2 bg-gray-300 text-gray-700 rounded-md">Отмена</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <custom-footer></custom-footer>

    <script src="components/auth.js"></script>
    <script>
        // Проверка прав администратора
        document.addEventListener('DOMContentLoaded', async function() {
            if (!window.pb) {
                showMessage('Система не загружена', 'error');
                return;
            }

            await pb.init();

            // Проверяем права
            const currentUser = pb.getCurrentUser();
            if (!currentUser || currentUser.role !== 'admin') {
                showMessage('Доступ запрещен! Только для администраторов.', 'error');
                setTimeout(() => window.location.href = 'login.html', 2000);
                return;
            }

            // Загружаем данные
            loadUsers();
            
            // Обработчики форм
            document.getElementById('userForm').addEventListener('submit', saveUser);
            document.getElementById('courseForm').addEventListener('submit', saveCourse);
        });

        // ========== ПОКАЗ СООБЩЕНИЙ ==========
        function showMessage(text, type = 'success') {
            const box = document.getElementById('messageBox');
            box.textContent = text;
            box.className = `fixed top-4 right-4 p-4 rounded-lg shadow-lg z-50 ${
                type === 'success' ? 'bg-green-500 text-white' : 'bg-red-500 text-white'
            }`;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 3000);
        }

        // ========== ПЕРЕКЛЮЧЕНИЕ ТАБОВ ==========
        function switchTab(tab) {
            // Скрываем все
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-button').forEach(el => {
                el.classList.remove('border-blue-500', 'text-blue-600');
                el.classList.add('border-transparent', 'text-gray-500');
            });

            // Показываем нужный
            document.getElementById(tab + 'Content').classList.remove('hidden');
            document.getElementById(tab + 'Tab').classList.add('border-blue-500', 'text-blue-600');
            document.getElementById(tab + 'Tab').classList.remove('border-transparent', 'text-gray-500');

            // Загружаем данные
            if (tab === 'users') loadUsers();
            else if (tab === 'courses') loadCourses();
            else if (tab === 'applications') loadApplications();
            else if (tab === 'feedbacks') loadFeedbacks();
        }

        // ========== ПОЛЬЗОВАТЕЛИ ==========
        function loadUsers() {
            const users = pb.getUsers();
            document.getElementById('usersCount').textContent = users.length;
            
            document.getElementById('usersTableBody').innerHTML = users.map(user => `
                <tr>
                    <td class="px-6 py-4 text-sm text-gray-900">${user.id}</td>
                    <td class="px-6 py-4 text-sm font-medium text-gray-900">${user.FIO || user.name}</td>
                    <td class="px-6 py-4 text-sm text-gray-900">${user.email}</td>
                    <td class="px-6 py-4">
                        <span class="px-2 py-1 text-xs font-semibold rounded-full ${
                            user.role === 'admin' ? 'bg-purple-100 text-purple-800' : 'bg-green-100 text-green-800'
                        }">
                            ${user.role === 'admin' ? 'Админ' : 'Пользователь'}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-900">${user.telephone || '-'}</td>
                    <td class="px-6 py-4 text-sm text-gray-900">${new Date(user.createdAt).toLocaleDateString('ru-RU')}</td>
                    <td class="px-6 py-4 text-sm font-medium space-x-2">
                        <button onclick="editUser('${user.id}')" class="text-blue-600 hover:text-blue-900">✏️</button>
                        ${user.id !== '1' ? `<button onclick="deleteUser('${user.id}')" class="text-red-600 hover:text-red-900">🗑️</button>` : ''}
                    </td>
                </tr>
            `).join('');
        }

        function openUserModal() {
            document.getElementById('userModalTitle').textContent = 'Добавить пользователя';
            document.getElementById('userForm').reset();
            document.getElementById('userId').value = '';
            document.getElementById('userPassword').required = true;
            document.getElementById('userModal').classList.remove('hidden');
        }

        function editUser(userId) {
            const user = pb.getUsers().find(u => u.id === userId);
            if (user) {
                document.getElementById('userModalTitle').textContent = 'Редактировать пользователя';
                document.getElementById('userId').value = user.id;
                document.getElementById('userFIO').value = user.FIO || '';
                document.getElementById('userName').value = user.name || user.username || '';
                document.getElementById('userEmail').value = user.email;
                document.getElementById('userPhone').value = user.telephone || '';
                document.getElementById('userRole').value = user.role;
                document.getElementById('userPassword').required = false;
                document.getElementById('userModal').classList.remove('hidden');
            }
        }

        function closeUserModal() {
            document.getElementById('userModal').classList.add('hidden');
        }

        function saveUser(e) {
            e.preventDefault();
            
            const userId = document.getElementById('userId').value;
            const userData = {
                FIO: document.getElementById('userFIO').value,
                name: document.getElementById('userName').value,
                username: document.getElementById('userName').value,
                email: document.getElementById('userEmail').value,
                telephone: document.getElementById('userPhone').value,
                role: document.getElementById('userRole').value
            };

            const password = document.getElementById('userPassword').value;
            if (password) userData.password = password;

            if (userId) {
                pb.updateUser(userId, userData);
                showMessage('✅ Пользователь обновлен');
            } else {
                if (!password) {
                    showMessage('❌ Пароль обязателен для нового пользователя', 'error');
                    return;
                }
                pb.addUser(userData);
                showMessage('✅ Пользователь добавлен');
            }

            closeUserModal();
            loadUsers();
        }

        function deleteUser(userId) {
            if (confirm('Вы уверены, что хотите удалить этого пользователя?')) {
                pb.deleteUser(userId);
                loadUsers();
                showMessage('🗑️ Пользователь удален');
            }
        }

        // ========== КУРСЫ ==========
        async function loadCourses() {
            const courses = await pb.getCourses();
            document.getElementById('coursesCount').textContent = courses.length;
            
            document.getElementById('coursesTableBody').innerHTML = courses.map(course => `
                <tr>
                    <td class="px-6 py-4 text-sm text-gray-900">${course.id}</td>
                    <td class="px-6 py-4 text-sm font-medium text-gray-900">
                        <span class="text-xl mr-2">${course.image || '📚'}</span>
                        ${course.name}
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-900">${course.category}</td>
                    <td class="px-6 py-4 text-sm text-gray-900">${course.price} ₽</td>
                    <td class="px-6 py-4 text-sm text-gray-900">${course.duration}</td>
                    <td class="px-6 py-4 text-sm font-medium space-x-2">
                        <button onclick="editCourse('${course.id}')" class="text-blue-600 hover:text-blue-900">✏️</button>
                        <button onclick="deleteCourse('${course.id}')" class="text-red-600 hover:text-red-900">🗑️</button>
                    </td>
                </tr>
            `).join('');
        }

        function openCourseModal() {
            document.getElementById('courseModalTitle').textContent = 'Добавить курс';
            document.getElementById('courseForm').reset();
            document.getElementById('courseId').value = '';
            document.getElementById('courseModal').classList.remove('hidden');
        }

        async function editCourse(courseId) {
            const courses = await pb.getCourses();
            const course = courses.find(c => c.id === courseId);
            if (course) {
                document.getElementById('courseModalTitle').textContent = 'Редактировать курс';
                document.getElementById('courseId').value = course.id;
                document.getElementById('courseName').value = course.name;
                document.getElementById('courseDescription').value = course.description;
                document.getElementById('courseCategory').value = course.category;
                document.getElementById('coursePrice').value = course.price;
                document.getElementById('courseDuration').value = course.duration;
                document.getElementById('courseImage').value = course.image || '';
                document.getElementById('courseModal').classList.remove('hidden');
            }
        }

        function closeCourseModal() {
            document.getElementById('courseModal').classList.add('hidden');
        }

        function saveCourse(e) {
            e.preventDefault();
            
            const courseId = document.getElementById('courseId').value;
            const courseData = {
                name: document.getElementById('courseName').value,
                description: document.getElementById('courseDescription').value,
                category: document.getElementById('courseCategory').value,
                price: parseInt(document.getElementById('coursePrice').value),
                duration: document.getElementById('courseDuration').value,
                image: document.getElementById('courseImage').value || '📚'
            };

            if (courseId) {
                pb.updateCourse(courseId, courseData);
                showMessage('✅ Курс обновлен');
            } else {
                pb.addCourse(courseData);
                showMessage('✅ Курс добавлен');
            }

            closeCourseModal();
            loadCourses();
        }

        function deleteCourse(courseId) {
            if (confirm('Вы уверены, что хотите удалить этот курс?')) {
                pb.deleteCourse(courseId);
                loadCourses();
                showMessage('🗑️ Курс удален');
            }
        }

        // ========== ЗАЯВКИ ==========
        function loadApplications() {
            const applications = pb.getAllApplications();
            document.getElementById('applicationsCount').textContent = applications.length;
            
            document.getElementById('applicationsTableBody').innerHTML = applications.map(app => {
                const user = pb.getUsers().find(u => u.id === app.user);
                return `
                    <tr>
                        <td class="px-6 py-4">
                            <div class="text-sm font-medium text-gray-900">${user ? (user.FIO || user.name) : 'Неизвестный'}</div>
                            <div class="text-sm text-gray-500">${user ? user.email : ''}</div>
                        </td>
                        <td class="px-6 py-4 text-sm text-gray-900">${app.course_name}</td>
                        <td class="px-6 py-4 text-sm text-gray-900">${new Date(app.start_date).toLocaleDateString('ru-RU')}</td>
                        <td class="px-6 py-4 text-sm text-gray-900">${app.payment_method === 'cash' ? 'Наличные' : 'Перевод'}</td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 text-xs font-semibold rounded-full ${
                                app.status === 'Новая' ? 'bg-blue-100 text-blue-800' :
                                app.status === 'Идет обучение' ? 'bg-yellow-100 text-yellow-800' :
                                'bg-green-100 text-green-800'
                            }">
                                ${app.status}
                            </span>
                        </td>
                        <td class="px-6 py-4 text-sm">
                            <select onchange="changeApplicationStatus('${app.id}', this.value)" 
                                    class="border border-gray-300 rounded p-1 text-sm">
                                <option value="">Изменить статус</option>
                                <option value="Новая">Новая</option>
                                <option value="Идет обучение">Идет обучение</option>
                                <option value="Обучение завершено">Обучение завершено</option>
                            </select>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function changeApplicationStatus(appId, newStatus) {
            if (!newStatus) return;
            
            if (confirm(`Изменить статус заявки на "${newStatus}"?`)) {
                pb.updateApplicationStatus(appId, newStatus);
                loadApplications();
                showMessage(`✅ Статус изменен на "${newStatus}"`);
            }
        }

        // ========== ОТЗЫВЫ ==========
function loadFeedbacks() {
    const feedbacks = pb.getFeedbacks();
    document.getElementById('feedbacksCount').textContent = feedbacks.length;
    
    document.getElementById('feedbacksTableBody').innerHTML = feedbacks.map(fb => {
        return `
            <tr>
                <td class="px-6 py-4">
                    <div class="text-sm font-medium text-gray-900">${fb.user_name}</div>
                    <div class="text-sm text-gray-500">${fb.user_email}</div>
                </td>
                <td class="px-6 py-4 text-sm text-gray-900">${fb.course_name}</td>
                <td class="px-6 py-4">
                    <div class="text-sm text-gray-900 max-w-xs">${fb.message}</div>
                </td>
                <td class="px-6 py-4 text-sm text-gray-900">${new Date(fb.created).toLocaleDateString('ru-RU')}</td>
                <td class="px-6 py-4">
                    <span class="px-2 py-1 text-xs font-semibold rounded-full ${
                        fb.status === 'approved' ? 'bg-green-100 text-green-800' :
                        fb.status === 'rejected' ? 'bg-red-100 text-red-800' :
                        'bg-yellow-100 text-yellow-800'
                    }">
                        ${fb.status === 'approved' ? 'Одобрен' : 
                          fb.status === 'rejected' ? 'Отклонен' : 'На модерации'}
                    </span>
                </td>
                <td class="px-6 py-4 text-sm space-x-2">
                    ${fb.status !== 'approved' ? 
                        `<button onclick="approveFeedback('${fb.id}')" class="text-green-600 hover:text-green-900">✅ Одобрить</button>` : 
                        ''}
                    ${fb.status !== 'rejected' ? 
                        `<button onclick="rejectFeedback('${fb.id}')" class="text-red-600 hover:text-red-900">❌ Отклонить</button>` : 
                        ''}
                </td>
            </tr>
        `;
    }).join('');
}

function approveFeedback(feedbackId) {
    pb.updateFeedbackStatus(feedbackId, 'approved');
    loadFeedbacks();
    showMessage('✅ Отзыв одобрен и будет показан на сайте');
}

function rejectFeedback(feedbackId) {
    pb.updateFeedbackStatus(feedbackId, 'rejected');
    loadFeedbacks();
    showMessage('❌ Отзыв отклонен');
}
    </script>
</body>
</html>
