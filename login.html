<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Корочки.есть</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="log-12-hdr">
        <div class="log-13-hcnt">
            <div class="log-14-logo"><a href="index.html">Корочки.есть</a></div>
            <div class="burger"><span></span><span></span><span></span></div>
            <nav class="nav-menu"></nav>
        </div>
    </header>
    
    <div class="log-20-cont">
        <div class="log-21-card" style="max-width: 500px; margin: 50px auto;">
            <h2>Вход в систему</h2>
            <form id="loginForm">
                <div class="log-24-fgrp">
                    <label>Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="log-28-fgrp">
                    <label>Пароль</label>
                    <input type="password" id="password" required>
                    <div class="log-31-err" id="loginError"></div>
                </div>
                <button type="submit" class="log-33-btn">Войти</button>
            </form>
            <p class="log-35-mt20">Нет аккаунта? <a href="register.html">Регистрация</a></p>
        </div>
    </div>
    
    <footer class="log-40-foot">
        <div class="log-41-fcont">
            <div class="log-42-fcol"><h4>Корочки.есть</h4><p>Дополнительное профессиональное образование</p></div>
            <div class="log-43-fcol"><h4>Контакты</h4><p>8(800)123-45-67</p><p>info@korochki.est</p></div>
            <div class="log-44-fcol"><h4>Юридическая информация</h4><p>Лицензия №1234</p><p>ОГРН 1234567890123</p></div>
        </div>
        <div class="log-47-fbot"><p>© 2026 Корочки.есть. Все права защищены.</p></div>
    </footer>
    
    <script src="js/common.js"></script>
    <script>
        localStorage.removeItem('user');
        localStorage.removeItem('token');
        currentUser = null;
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');
            
            try {
                await pbLogin(email, password);
                window.location.href = 'dashboard.html';
            } catch(err) {
                errorDiv.textContent = err.message;
            }
        });
    </script>
</body>
</html>
