<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Корочки.есть</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="login-12-header">
        <div class="login-13-header-container">
            <div class="login-14-logo"><a href="index.html">Корочки.есть</a></div>
            <div class="login-15-burger"><span></span><span></span><span></span></div>
            <nav class="login-16-nav-menu"></nav>
        </div>
    </header>
    
    <div class="login-20-container">
        <div class="login-21-card" style="max-width: 500px; margin: 50px auto;">
            <h2>Вход в систему</h2>
            <form id="login-23-loginForm">
                <div class="login-24-form-group">
                    <label>Email</label>
                    <input type="email" id="login-26-email" required>
                </div>
                <div class="login-28-form-group">
                    <label>Пароль</label>
                    <input type="password" id="login-30-password" required>
                    <div class="login-31-error" id="login-31-loginError"></div>
                </div>
                <button type="submit" class="login-33-btn">Войти</button>
            </form>
            <p class="login-35-mt-20">Нет аккаунта? <a href="register.html">Регистрация</a></p>
        </div>
    </div>
    
    <footer class="login-39-footer">
        <div class="login-40-footer-container">
            <div class="login-41-footer-col"><h4>Корочки.есть</h4><p>Дополнительное профессиональное образование</p></div>
            <div class="login-42-footer-col"><h4>Контакты</h4><p>8(800)123-45-67</p><p>info@korochki.est</p></div>
            <div class="login-43-footer-col"><h4>Юридическая информация</h4><p>Лицензия №1234</p><p>ОГРН 1234567890123</p></div>
        </div>
        <div class="login-45-footer-bottom"><p>© 2026 Корочки.есть. Все права защищены.</p></div>
    </footer>
    
    <script src="js/common.js"></script>
    <script>
        // Очищаем старые данные при загрузке страницы входа
        localStorage.removeItem('pb_user');
        localStorage.removeItem('pb_token');
        currentUser = null;
        
        document.getElementById('login-23-loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-26-email').value.trim();
            const password = document.getElementById('login-30-password').value;
            const errorDiv = document.getElementById('login-31-loginError');
            
            try {
                console.log('Попытка входа:', email);
                await pbLogin(email, password);
                console.log('Вход успешен, редирект на dashboard');
                window.location.href = 'dashboard.html';
            } catch(err) {
                console.error('Ошибка входа:', err);
                errorDiv.textContent = err.message;
            }
        });
    </script>
</body>
</html>
