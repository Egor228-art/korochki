<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новая заявка - Корочки.есть</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="applicationForm-12-header">
        <div class="applicationForm-13-header-container">
            <div class="applicationForm-14-logo"><a href="index.html">Корочки.есть</a></div>
            <div class="applicationForm-15-burger"><span></span><span></span><span></span></div>
            <nav class="applicationForm-16-nav-menu"></nav>
        </div>
    </header>
    
    <div class="applicationForm-20-container">
        <div class="applicationForm-21-card applicationForm-21-application-card">
            <h2>Формирование заявки</h2>
            <form id="applicationForm-23-applicationForm">
                <div class="applicationForm-24-form-group">
                    <label>Наименование курса</label>
                    <select id="applicationForm-26-courseName" required>
                        <option value="">-- Выберите курс --</option>
                    </select>
                </div>
                <div class="applicationForm-30-form-group">
                    <label>Желаемая дата начала</label>
                    <input type="date" id="applicationForm-32-startDate" required>
                    <div class="applicationForm-33-error" id="applicationForm-33-dateError"></div>
                </div>
                <div class="applicationForm-35-form-group">
                    <label>Способ оплаты</label>
                    <select id="applicationForm-37-paymentMethod" required>
                        <option value="Наличные">Наличные</option>
                        <option value="Карта">Карта</option>
                    </select>
                </div>
                <button type="submit" class="applicationForm-42-btn applicationForm-42-btn-primary">Отправить заявку</button>
            </form>
        </div>
    </div>
    
    <footer class="applicationForm-47-footer">
        <div class="applicationForm-48-footer-container">
            <div class="applicationForm-49-footer-col"><h4>Корочки.есть</h4><p>Дополнительное профессиональное образование</p></div>
            <div class="applicationForm-50-footer-col"><h4>Контакты</h4><p>8(800)123-45-67</p><p>info@korochki.est</p></div>
            <div class="applicationForm-51-footer-col"><h4>Юридическая информация</h4><p>Лицензия №1234</p><p>ОГРН 1234567890123</p></div>
        </div>
        <div class="applicationForm-53-footer-bottom"><p>© 2026 Корочки.есть. Все права защищены.</p></div>
    </footer>
    
    <script src="js/common.js"></script>
    <script>
        // Проверяем авторизацию
        if (!requireAuth()) {
            throw new Error('Не авторизован');
        }
        
        console.log('Текущий пользователь:', currentUser);
        
        async function loadCoursesToSelect() {
            const courses = await getCourses();
            const select = document.getElementById('applicationForm-26-courseName');
            select.innerHTML = '<option value="">-- Выберите курс --</option>';
            courses.forEach(c => {
                const option = document.createElement('option');
                option.value = c.name;
                option.textContent = `${c.name} (${c.hours} ч., ${c.price.toLocaleString()} ₽)`;
                select.appendChild(option);
            });
            
            const selected = localStorage.getItem('selectedCourse');
            if (selected) {
                select.value = selected;
                localStorage.removeItem('selectedCourse');
            }
        }
        
        document.getElementById('applicationForm-23-applicationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const courseName = document.getElementById('applicationForm-26-courseName').value;
            const startDate = document.getElementById('applicationForm-32-startDate').value;
            const paymentMethod = document.getElementById('applicationForm-37-paymentMethod').value;
            const today = new Date().toISOString().split('T')[0];
            
            if (!courseName) {
                alert('Выберите курс');
                return;
            }
            if (startDate < today) {
                document.getElementById('applicationForm-33-dateError').textContent = 'Дата не может быть в прошлом';
                return;
            }
            document.getElementById('applicationForm-33-dateError').textContent = '';
            
            try {
                // Проверяем данные перед отправкой
                const applicationData = {
                    user: currentUser.id,
                    course_name: courseName,
                    desired_start_date: startDate,
                    payment_method: paymentMethod,
                    status: 'Новая'
                };
                console.log('Отправляем заявку:', applicationData);
                
                const result = await createApplication(applicationData);
                console.log('Заявка создана:', result);
                alert('Заявка успешно отправлена!');
                window.location.href = 'dashboard.html';
            } catch(err) {
                console.error('Ошибка:', err);
                alert('Ошибка при отправке заявки: ' + err.message);
            }
        });
        
        loadCoursesToSelect();
    </script>
</body>
</html>
